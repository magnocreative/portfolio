<!--
  The browser-tab mark. Three things differ from the Logo component, each for a
  reason:

  1. Literal hex, not var(--mark-deep). A favicon renders outside the document
     and has no access to the page's custom properties.

  2. A square viewBox. The artboard is 270x203, and dropped into a square
     favicon slot a 4:3 mark renders at 75% of the height available to it. The
     300x300 box with the mark centred lets it fill the width, which is what
     makes it survive 16px.

  3. It lifts on dark chrome, and ONLY here. The site's mark is one value in
     both themes and stays that way: on the site we own both grounds, and
     blue-600 clears 3.60:1 against the darkest of them. Browser chrome is not
     ours. Measured against the real values — Chrome's dark bar #202124, an
     inactive tab #292a2d, the ACTIVE tab #35363a, Safari #2d2d2d, Firefox
     #38383d — the deep peak lands at 3.22, 2.87, 2.41, 2.75 and 2.33:1. The
     worst of those is the active tab, which is the one a person is looking at.

     So the peaks lift a step each on dark: blue-600 to blue-400 and blue-400
     to blue-200. That takes the silhouette to 4.38:1 at worst and keeps 1.83:1
     between the two peaks, which is enough to read as two shapes.

     This is not the dark-mode lift that was deleted from the logo tokens. That
     one was taste on a ground we control and measured fine without it. This is
     a measured failure on a ground we do not control, and the fix is scoped to
     the one file that meets it.

     No WCAG criterion governs a favicon — it is user-agent chrome, not
     content, so the standard does not reach it. 3:1 is still the right
     yardstick for whether a small graphic reads, and the light artwork missed
     it. favicon.ico cannot carry a media query, so it keeps the light values
     and is served to browsers old enough not to take an SVG.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
  <style>
    .deep { fill: #4e729a; }
    .light { fill: #80a2c4; }
    @media (prefers-color-scheme: dark) {
      .deep { fill: #80a2c4; }
      .light { fill: #c5d8ed; }
    }
  </style>
  <g transform="translate(14.66 48.32)">
    <path class="light" d="M270.37,197.9L181.13,1.16c-.7-1.54-2.88-1.54-3.58-.01l-36.46,79.22c-.49,1.07-.5,2.31-.02,3.39l22.18,49.68c.39.88,1.65.87,2.03-.01l12.27-28.61c.7-1.55,2.9-1.55,3.59,0l43.73,97.39c.32.71,1.02,1.16,1.8,1.16h39.03c3.45,0,5.85-2.81,4.66-5.46ZM186.07,54.43l-6.67,7.6-7.2-7.6-13.33,12.52,20.53-45.21,20.53,45.21-13.87-12.52Z"/>
    <path class="deep" d="M182.76,197.89L93.53,1.15c-.38-.84-1.21-1.21-1.99-1.13-.79-.08-1.61.29-1.99,1.13L.31,197.89c-1.19,2.65,1.21,5.46,4.66,5.46h39.03c.78,0,1.48-.46,1.8-1.16l43.73-97.39c.38-.85,1.22-1.22,2.01-1.13.79-.08,1.63.28,2.01,1.13l43.73,97.39c.32.71,1.02,1.16,1.8,1.16h39.03c3.45,0,5.85-2.81,4.66-5.46ZM98.23,54.47l-6.69,7.63-7.23-7.63-13.39,12.58,20.62-45.4,20.62,45.4-13.92-12.58Z"/>
  </g>
</svg>
